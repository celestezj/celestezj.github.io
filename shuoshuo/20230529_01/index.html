<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('figure.highlight').forEach(fig => {
    // 关键：给代码块外面套一层容器，专门用来固定按钮
    const wrapper = document.createElement('div');
    wrapper.className = 'highlight-container';
    fig.parentNode.insertBefore(wrapper, fig);
    wrapper.appendChild(fig);

    // 创建按钮
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    // btn.textContent = 'copy';
    btn.innerHTML = '<i class="fa-regular fa-copy"></i>';
    wrapper.appendChild(btn);

    // 复制逻辑
    btn.addEventListener('click', async () => {
      const codeEl = fig.querySelector('td.code pre');
      const text = codeEl.innerHTML
        .replace(/<br>/g, '\n')
        .replace(/<[^>]+>/g, '')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&')
        .trim();
      await navigator.clipboard.writeText(text);
      // btn.textContent = 'copied';
      btn.innerHTML = '<i class="fa-solid fa-check"></i>';
      // setTimeout(() => btn.textContent = 'copy', 1500);
      setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
    });
  });
});
</script>
  
<script>
function addHeaderMark() {
  // 去重：避免 PJAX 多次执行重复加 span
  document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
    // 如果已经有我们加的 mark，就跳过
    if (h.querySelector('.header-level-mark')) return;

    const level = h.tagName;
    const mark = document.createElement('span');
    mark.className = 'header-level-mark'; // 标记，用于去重
    mark.textContent = ' ' + level;
    mark.style = 'color:#ddd; font-size:0.6em; font-weight:normal;';
    h.appendChild(mark);
  });
}

// 首次整页加载
document.addEventListener('DOMContentLoaded', function() {
  // console.log("init header mark");
  addHeaderMark();
});

// 暴露到全局，供 PJAX 调用
window.addHeaderMark = addHeaderMark;

</script>

<script>
document.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(el => {
  const level = el.tagName.toLowerCase();
  const text = {
    h1: '一级标题 H1',
    h2: '二级标题 H2',
    h3: '三级标题 H3',
    h4: '四级标题 H4',
    h5: '五级标题 H5',
    h6: '六级标题 H6'
  }[level];
  el.setAttribute('title', text);
});
</script>
